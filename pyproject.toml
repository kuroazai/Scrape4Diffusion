[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loraprep"
version = "0.2.0"
description = "Turn a folder of images into a trainable LoRA dataset for kohya_ss"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fidelis Mwansa" }]
keywords = ["stable-diffusion", "lora", "kohya", "dataset", "blip", "captioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = ["Pillow>=9"]

[project.optional-dependencies]
# BLIP pulls torch. Keeping it optional means the dataset layout, resizing and
# command building all work on a machine with no GPU stack at all.
blip = ["transformers>=4.30", "torch>=2.0"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
loraprep = "loraprep.cli:main"

[project.urls]
Homepage = "https://github.com/kuroazai/loraprep"

[tool.hatch.build.targets.wheel]
packages = ["src/loraprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12 rather than 3.10: numpy's bundled stubs (pulled in via Pillow) use PEP 695
# `type` statements that older target versions cannot parse, and the failure
# aborts the whole run. The package itself supports 3.10+.
python_version = "3.12"
files = ["src/loraprep"]
ignore_missing_imports = true
